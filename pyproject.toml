[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "power-meter"
version = "0.1.0"
description = "PC Power & Cost Meter: live PC wall power and electricity cost in Thai Baht (THB)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["customtkinter>=6.0,<7", "nvidia-ml-py>=13"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "pyinstaller>=6.22"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
power_meter = ["data/holidays_th.json", "data/icon.ico"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
packages = ["power_meter"]
mypy_path = "src"

[[tool.mypy.overrides]]
# nvidia-ml-py and customtkinter ship without type information.
module = ["pynvml", "customtkinter"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Views subclass customtkinter widgets, which are untyped.
module = ["power_meter.ui.*"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
